<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>뚱띠월드</title>
  <!-- 귀여운 폰트 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gamja+Flower&family=Single+Day&display=swap" rel="stylesheet">
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Gamja Flower', cursive, sans-serif; }
    body { background: #FFF5F7; color: #5A4A42; display: flex; justify-content: center; height: 100vh; font-size: 1.1rem; }
    #app { width: 100%; max-width: 480px; background: #FFFDF9; display: flex; flex-direction: column; height: 100%; border-left: 2px solid #FFD1DC; border-right: 2px solid #FFD1DC; box-shadow: 0 0 15px rgba(255,182,193,0.3); }
    
    /* 프로필 모달 */
    .modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .modal-content { background: #FFF0F5; padding: 24px; border-radius: 24px; width: 85%; max-width: 360px; text-align: center; border: 3px solid #FFB6C1; }
    .modal-content h2 { color: #FF69B4; font-family: 'Single Day', cursive; font-size: 2rem; margin-bottom: 12px; }
    .profile-preview { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; margin: 0 auto 12px auto; display: block; border: 3px solid #FFB6C1; background: #fff; }
    .modal-content input[type="text"] { width: 100%; padding: 10px; margin-bottom: 12px; border: 2px solid #FFC0CB; border-radius: 12px; outline: none; text-align: center; font-size: 1.1rem; }
    .modal-content input[type="file"] { margin-bottom: 16px; font-size: 0.9rem; }
    .btn { padding: 10px 16px; background: #FFB6C1; color: #fff; border: none; border-radius: 16px; cursor: pointer; font-weight: bold; font-size: 1.3rem; width: 100%; transition: 0.2s; }
    .btn:hover { background: #FF99AA; }
    
    /* 상단 네비게이션 */
    header { background: #FFB6C1; color: #fff; padding: 14px; text-align: center; font-family: 'Single Day', cursive; font-size: 2.2rem; letter-spacing: 2px; }
    nav { display: flex; background: #FFE4E1; border-bottom: 2px solid #FFD1DC; overflow-x: auto; }
    nav button { flex: 1; padding: 10px 6px; border: none; background: none; font-size: 1.1rem; color: #8B5A2B; cursor: pointer; white-space: nowrap; font-weight: bold; }
    nav button.active { background: #FFFDF9; color: #FF69B4; border-bottom: 4px solid #FF69B4; }
    
    /* 콘텐츠 영역 */
    .tab-content { flex: 1; display: none; flex-direction: column; overflow: hidden; }
    .tab-content.active { display: flex; }
    
    /* 채팅 영역 (입력창을 상단으로 이동) */
    .chat-input-area { display: flex; padding: 10px; border-bottom: 2px solid #FFE4E1; background: #FFF0F5; align-items: center; }
    .chat-input-area input[type="text"] { flex: 1; padding: 8px 12px; border: 2px solid #FFC0CB; border-radius: 12px; margin-right: 6px; outline: none; font-size: 1.05rem; }
    .chat-input-area label { padding: 6px 10px; background: #FFE4E1; border: 2px solid #FFC0CB; border-radius: 12px; cursor: pointer; margin-right: 6px; font-size: 1.2rem; }
    .chat-input-area input[type="file"] { display: none; }
    .chat-input-area button { padding: 8px 14px; background: #FFB6C1; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-size: 1.1rem; }
    
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; background: #FFFDF9; }
    .message-item { display: flex; align-items: flex-start; margin-bottom: 12px; }
    .message-item img.avatar-img { width: 42px; height: 42px; border-radius: 50%; margin-right: 8px; object-fit: cover; border: 2px solid #FFD1DC; }
    .message-body { max-width: 75%; }
    .message-author { font-size: 0.95rem; color: #AA7788; margin-bottom: 2px; }
    .message-bubble { background: #FFE4E1; padding: 8px 14px; border-radius: 16px; font-size: 1.1rem; color: #4A3B32; word-break: break-word; border: 1px solid #FFD1DC; }
    .message-img { max-width: 100%; border-radius: 12px; margin-top: 6px; border: 2px solid #FFD1DC; }
    
    /* 리스트 UI */
    .list-container { padding: 12px; overflow-y: auto; flex: 1; }
    .list-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; border-bottom: 1px dashed #FFD1DC; background: #FFF0F5; margin-bottom: 8px; border-radius: 16px; }
    .list-item-left { display: flex; align-items: center; }
    .list-item img { width: 44px; height: 44px; border-radius: 50%; margin-right: 10px; object-fit: cover; border: 2px solid #FFB6C1; }
    .action-btn { padding: 6px 12px; background: #FF99AA; color: #fff; border: none; border-radius: 12px; cursor: pointer; font-size: 1rem; margin-left: 4px; }
    .action-btn:hover { background: #FF7788; }
    
    /* Sub Modal */
    .sub-modal { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); display:none; align-items:center; justify-content:center; z-index: 150; }
    .sub-modal-content { background:#FFF0F5; padding:20px; border-radius:20px; width:80%; max-width:320px; border:3px solid #FFB6C1; text-align:center; }
  </style>
</head>
<body>

  <!-- 프로필 설정 모달 -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>🍓 뚱띠월드 프로필 🍓</h2>
      <img id="previewImg" class="profile-preview" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='35' fill='%23ff99aa'/><path d='M50 20 Q55 10 65 15' stroke='%2377dd77' stroke-width='5' fill='none'/><circle cx='40' cy='50' r='4' fill='%235A4A42'/><circle cx='60' cy='50' r='4' fill='%235A4A42'/><path d='M45 62 Q50 67 55 62' stroke='%235A4A42' stroke-width='3' fill='none'/></svg>" alt="기본프사">
      <input type="file" id="avatarInput" accept="image/*">
      <input type="text" id="nicknameInput" maxlength="20" placeholder="닉네임 입력 (최대 20자)">
      <button class="btn" id="startBtn">뚱띠월드 입장하기!</button>
    </div>
  </div>

  <div id="app">
    <header>🎀 뚱띠월드 🎀</header>
    
    <nav>
      <button id="tabNav-main" class="active" onclick="switchTab('main')">메인채팅방 (<span id="navNick">-</span>)</button>
      <button id="tabNav-rooms" onclick="switchTab('rooms')">새 채팅방</button>
      <button id="tabNav-users" onclick="switchTab('users')">접속자</button>
      <button id="tabNav-friends" onclick="switchTab('friends')">친구 & 교환</button>
    </nav>

    <!-- 1. 메인 채팅방 -->
    <div id="tab-main" class="tab-content active">
      <div class="chat-input-area">
        <label for="mainImgInput">📷</label>
        <input type="file" id="mainImgInput" accept="image/*">
        <input type="text" id="mainTextInput" placeholder="메시지를 입력해봐요..." onkeydown="if(event.key==='Enter') sendText('main')">
        <button onclick="sendText('main')">전송</button>
      </div>
      <div id="mainChatMessages" class="chat-messages"></div>
    </div>

    <!-- 2. 개설된 채팅방 목록 -->
    <div id="tab-rooms" class="tab-content">
      <div style="padding: 12px; border-bottom: 2px solid #FFE4E1; display: flex; gap: 8px; background:#FFF0F5;">
        <input type="text" id="newRoomTitle" placeholder="새 방 제목 입력" style="flex:1; padding:8px 12px; border:2px solid #FFC0CB; border-radius:12px; outline:none; font-size:1rem;">
        <button class="action-btn" style="background:#FFB6C1;" onclick="createRoom()">방 개설</button>
      </div>
      <div id="roomList" class="list-container"></div>
    </div>

    <!-- 3. 개별 커스텀 방 화면 -->
    <div id="tab-custom-room" class="tab-content">
      <div style="padding: 10px 14px; background: #FFE4E1; display: flex; justify-content: space-between; align-items: center; border-bottom:2px solid #FFD1DC;">
        <b id="currentRoomTitle" style="color:#FF69B4; font-size:1.3rem;">채팅방</b>
        <button class="action-btn" style="background:#B0C4DE;" onclick="switchTab('rooms')">나가기</button>
      </div>
      <div class="chat-input-area">
        <label for="customImgInput">📷</label>
        <input type="file" id="customImgInput" accept="image/*">
        <input type="text" id="customTextInput" placeholder="메시지를 입력해봐요..." onkeydown="if(event.key==='Enter') sendText('custom')">
        <button onclick="sendText('custom')">전송</button>
      </div>
      <div id="customChatMessages" class="chat-messages"></div>
    </div>

    <!-- 4. 접속중인 사람들 목록 -->
    <div id="tab-users" class="tab-content">
      <div id="userList" class="list-container"></div>
    </div>

    <!-- 5. 친구 목록 & 교환 -->
    <div id="tab-friends" class="tab-content">
      <div style="padding: 12px; background: #FFF0F5; border-bottom: 2px solid #FFD1DC; text-align: center; font-size:1.2rem; color:#FF69B4;">
        내 좋은마음 아이템: <b id="itemCount">0</b>개 ❤️
      </div>
      <div id="friendList" class="list-container"></div>
    </div>
  </div>

  <!-- 귓속말 모달 -->
  <div id="whisperModal" class="sub-modal">
    <div class="sub-modal-content">
      <h3 id="whisperTargetName" style="color:#FF69B4; margin-bottom:10px;">귓속말</h3>
      <input type="text" id="whisperInput" placeholder="보낼 귓속말 내용" style="width:100%; padding:8px; margin:10px 0; border:2px solid #FFC0CB; border-radius:12px; outline:none; text-align:center;">
      <div style="display:flex; justify-content:center; gap:8px;">
        <button class="action-btn" style="background:#B0C4DE;" onclick="closeWhisper()">취소</button>
        <button class="action-btn" onclick="sendWhisper()">전송</button>
      </div>
    </div>
  </div>

  <!-- Firebase SDK 모듈 불러오기 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, set, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDI9ygzpduvSXl8iayPFsJ0qTwrza9B6uY",
      authDomain: "anonymous-chat-9cc26.firebaseapp.com",
      projectId: "anonymous-chat-9cc26",
      storageBucket: "anonymous-chat-9cc26.firebasestorage.app",
      messagingSenderId: "20872212384",
      appId: "1:20872212384:web:1fcc2e28d084e6bde33ec5",
      databaseURL: "https://anonymous-chat-9cc26-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const defaultAvatar = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='55' r='35' fill='%23ff99aa'/><path d='M50 20 Q55 10 65 15' stroke='%2377dd77' stroke-width='5' fill='none'/><circle cx='40' cy='50' r='4' fill='%235A4A42'/><circle cx='60' cy='50' r='4' fill='%235A4A42'/><path d='M45 62 Q50 67 55 62' stroke='%235A4A42' stroke-width='3' fill='none'/></svg>";

    let myUid = "user_" + Math.random().toString(36).substr(2, 9);
    let myProfile = { uid: myUid, nickname: '', avatar: defaultAvatar };
    let goodMindItems = 0;
    let friends = {};
    let activeUsers = {};
    let customRooms = {};
    let currentCustomRoomId = null;
    let currentWhisperTargetUid = null;

    // 아바타 파일 미리보기 & Base64 변환
    document.getElementById('avatarInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (evt) => {
          document.getElementById('previewImg').src = evt.target.result;
          myProfile.avatar = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 시작 버튼 클릭
    document.getElementById('startBtn').addEventListener('click', () => {
      const nick = document.getElementById('nicknameInput').value.trim();
      if (!nick) {
        alert('닉네임을 입력해주세요!');
        return;
      }
      myProfile.nickname = nick;
      document.getElementById('navNick').innerText = nick;
      document.getElementById('profileModal').style.display = 'none';

      // 접속자 등록 (Realtime DB)
      const userRef = ref(db, 'presence/' + myUid);
      set(userRef, myProfile);
      onDisconnect(userRef).remove();

      initRealtimeListeners();
    });

    // 파이어베이스 실시간 동기화 설정
    function initRealtimeListeners() {
      // 1. 메인 채팅 동기화 (최신 메시지가 위에 오도록 처리)
      onValue(ref(db, 'chats/main'), (snapshot) => {
        const data = snapshot.val();
        const list = [];
        if (data) {
          Object.keys(data).forEach(key => list.push(data[key]));
        }
        // 최신 메시지가 배열 앞(위쪽)에 오도록 반전
        renderMessages('mainChatMessages', list.reverse());
      });

      // 2. 채팅방 목록 동기화
      onValue(ref(db, 'rooms'), (snapshot) => {
        customRooms = snapshot.val() || {};
        renderRoomList();
      });

      // 3. 접속자 동기화
      onValue(ref(db, 'presence'), (snapshot) => {
        activeUsers = snapshot.val() || {};
        renderUserList();
      });

      // 4. 나에게 온 귓속말 수신
      onValue(ref(db, 'whispers/' + myUid), (snapshot) => {
        const data = snapshot.val();
        if (data) {
          Object.keys(data).forEach(key => {
            const w = data[key];
            alert(`💌 [${w.fromNick}님의 귓속말]: ${w.text}`);
          });
          // 수신 후 삭제
          set(ref(db, 'whispers/' + myUid), null);
        }
      });
    }

    // 메시지 렌더링
    window.renderMessages = function(containerId, list) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      list.forEach(msg => {
        const item = document.createElement('div');
        item.className = 'message-item';
        
        let contentHtml = `<div class="message-bubble">${msg.text}</div>`;
        if (msg.imgUrl) {
          contentHtml += `<img class="message-img" src="${msg.imgUrl}">`;
        }

        item.innerHTML = `
          <img class="avatar-img" src="${msg.avatar}">
          <div class="message-body">
            <div class="message-author">${msg.author}</div>
            ${contentHtml}
          </div>
        `;
        container.appendChild(item);
      });
    }

    // 텍스트 전송
    window.sendText = function(type) {
      const inputId = type === 'main' ? 'mainTextInput' : 'customTextInput';
      const input = document.getElementById(inputId);
      const text = input.value.trim();
      if (!text) return;

      const path = type === 'main' ? 'chats/main' : `chats/custom/${currentCustomRoomId}`;
      push(ref(db, path), {
        author: myProfile.nickname,
        avatar: myProfile.avatar,
        text: text,
        timestamp: Date.now()
      });
      input.value = '';
    }

    // 이미지 전송 (Base64)
    window.sendImage = function(e, type) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const path = type === 'main' ? 'chats/main' : `chats/custom/${currentCustomRoomId}`;
        push(ref(db, path), {
          author: myProfile.nickname,
          avatar: myProfile.avatar,
          text: '📷 사진을 보냈습니다.',
          imgUrl: evt.target.result,
          timestamp: Date.now()
        });
        e.target.value = '';
      };
      reader.readAsDataURL(file);
    }
    
    document.getElementById('mainImgInput').addEventListener('change', (e) => sendImage(e, 'main'));
    document.getElementById('customImgInput').addEventListener('change', (e) => sendImage(e, 'custom'));

    // 방 개설
    window.createRoom = function() {
      const titleInput = document.getElementById('newRoomTitle');
      const title = titleInput.value.trim();
      if (!title) return;

      const newRoomRef = push(ref(db, 'rooms'));
      set(newRoomRef, { title: title });
      titleInput.value = '';
    }

    function renderRoomList() {
      const container = document.getElementById('roomList');
      container.innerHTML = '';
      Object.keys(customRooms).forEach(key => {
        const room = customRooms[key];
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <span><b>${room.title}</b></span>
          <button class="action-btn" style="background:#FFB6C1;" onclick="enterRoom('${key}', '${room.title}')">입장</button>
        `;
        container.appendChild(item);
      });
    }

    window.enterRoom = function(id, title) {
      currentCustomRoomId = id;
      document.getElementById('currentRoomTitle').innerText = title;
      
      // 개별 방 메시지 구독
      onValue(ref(db, `chats/custom/${id}`), (snapshot) => {
        const data = snapshot.val();
        const list = [];
        if (data) {
          Object.keys(data).forEach(k => list.push(data[k]));
        }
        renderMessages('customChatMessages', list.reverse());
      });

      switchTab('custom-room');
    }

    // 접속자 및 친구 관리
    function renderUserList() {
      const container = document.getElementById('userList');
      container.innerHTML = '';
      Object.keys(activeUsers).forEach(uid => {
        if (uid === myUid) return; // 나 자신 제외
        const user = activeUsers[uid];
        const isFriend = !!friends[uid];

        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="list-item-left">
            <img src="${user.avatar}">
            <span>${user.nickname}</span>
          </div>
          ${isFriend 
            ? '<span style="font-size:0.9rem; color:#AA7788;">친구됨</span>' 
            : `<button class="action-btn" onclick="addFriend('${uid}')">친구추가</button>`}
        `;
        container.appendChild(item);
      });
    }

    window.addFriend = function(uid) {
      const user = activeUsers[uid];
      if (user && !friends[uid]) {
        friends[uid] = user;
        goodMindItems += 1;
        document.getElementById('itemCount').innerText = goodMindItems;
        alert(`${user.nickname}님을 친구로 추가했습니다! ('좋은마음' 아이템 +1)`);
        renderUserList();
        renderFriendList();
      }
    }

    function renderFriendList() {
      const container = document.getElementById('friendList');
      container.innerHTML = '';
      const keys = Object.keys(friends);
      if (keys.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:#AA7788; padding:20px;">추가된 친구가 없습니다.</div>';
        return;
      }
      keys.forEach(uid => {
        const friend = friends[uid];
        const item = document.createElement('div');
        item.className = 'list-item';
        item.innerHTML = `
          <div class="list-item-left">
            <img src="${friend.avatar}">
            <span>${friend.nickname}</span>
          </div>
          <div>
            <button class="action-btn" style="background:#FF99BB;" onclick="openWhisper('${uid}', '${friend.nickname}')">귓속말</button>
            <button class="action-btn" style="background:#CDA4DE;" onclick="exchangeItem('${friend.nickname}')">아이템 교환</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    window.openWhisper = function(uid, nickname) {
      currentWhisperTargetUid = uid;
      document.getElementById('whisperTargetName').innerText = `${nickname}님에게 귓속말`;
      document.getElementById('whisperModal').style.display = 'flex';
    }

    window.closeWhisper = function() {
      document.getElementById('whisperModal').style.display = 'none';
      document.getElementById('whisperInput').value = '';
    }

    window.sendWhisper = function() {
      const text = document.getElementById('whisperInput').value.trim();
      if (text && currentWhisperTargetUid) {
        push(ref(db, 'whispers/' + currentWhisperTargetUid), {
          fromNick: myProfile.nickname,
          text: text
        });
        alert('귓속말을 전송했습니다!');
        closeWhisper();
      }
    }

    window.exchangeItem = function(nickname) {
      if (goodMindItems <= 0) {
        alert('교환할 "좋은마음" 아이템이 부족합니다!');
        return;
      }
      goodMindItems -= 1;
      document.getElementById('itemCount').innerText = goodMindItems;
      alert(`${nickname}님과 "좋은마음" 아이템 1개를 교환했습니다! ❤️`);
    }

    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));

      if (tabId === 'custom-room') {
        document.getElementById('tab-custom-room').classList.add('active');
      } else {
        document.getElementById('tab-' + tabId).classList.add('active');
        const navBtn = document.getElementById('tabNav-' + tabId);
        if (navBtn) navBtn.classList.add('active');
      }
    }
  </script>
</body>
</html>
