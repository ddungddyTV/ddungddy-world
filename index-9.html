<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#ff8eb1"><title>뚱띠월드</title>
<style>
:root{--pink:#ff8eb1;--deep:#d94d7d;--bg:#fff5f8;--line:#f5d5e0;--ink:#49323b;--muted:#987985}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,sans-serif}.app{max-width:620px;margin:auto;min-height:100dvh;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 25px #0001}.top{background:linear-gradient(120deg,#ff9cba,#ffc0d2);padding:17px 16px;color:#fff}.top h1{margin:0;font-size:23px}.top small{opacity:.9}.tabs{display:flex;overflow:auto;gap:8px;padding:10px;background:#fff;border-bottom:1px solid var(--line);scrollbar-width:none}.tabs button{white-space:nowrap;border:0;border-radius:20px;padding:9px 13px;background:#fff0f5;color:var(--deep);font-weight:700}.tabs button.active{background:var(--deep);color:#fff}.page{display:none;padding:14px;flex:1}.page.active{display:block}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}.avatar{width:43px;height:43px;border-radius:50%;display:grid;place-items:center;background:#fff0f5;font-size:27px;flex-shrink:0}.name{font-weight:800}.muted,.sub{font-size:12px;color:var(--muted)}button{cursor:pointer}input{min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;outline:none}input:focus{border-color:var(--pink)}.primary,.soft,.send{border:0;border-radius:12px;padding:10px 13px;font-weight:800}.primary,.send{background:var(--deep);color:white}.soft{background:#fff0f5;color:var(--deep)}.composer{display:flex;gap:7px;padding:12px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}.composer input{flex:1}.messages{height:55dvh;overflow:auto;padding:8px;background:#fff9fb;border-radius:13px}.msg{margin:9px 0;max-width:85%;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:14px;overflow-wrap:anywhere}.msg.mine{margin-left:auto;background:#ffedf3}.msg .meta{font-size:11px;color:var(--muted);margin-bottom:3px}.empty{text-align:center;padding:25px;color:var(--muted)}.overlay{display:none;position:fixed;inset:0;background:#0007;z-index:5;align-items:center;justify-content:center;padding:14px}.overlay.show{display:flex}.modal{width:100%;max-width:560px;background:white;border-radius:20px;padding:16px;max-height:90dvh;overflow:auto}.fruit{display:flex;gap:8px;flex-wrap:wrap}.fruit button{font-size:29px;border:2px solid transparent;background:#fff3f7;border-radius:14px;padding:8px}.fruit button.sel{border-color:var(--deep)}#setup{position:fixed;inset:0;background:#fff5f8;z-index:10;display:none;align-items:center;justify-content:center;padding:20px}.setup-card{max-width:420px;width:100%;background:white;border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 35px #0001}footer{text-align:center;color:var(--muted);font-size:11px;padding:12px}
</style></head><body><div class="app">
<header class="top"><h1>🍑 뚱띠월드</h1><small>서로에게 다정한 말을 건네봐요</small></header>
<nav class="tabs"><button class="active" data-page="chat">💬 메인채팅</button><button data-page="rooms">🏠 채팅방</button><button data-page="online">🟢 접속자</button><button data-page="friends">💗 친구</button><button data-page="items">🎁 아이템</button></nav>
<section class="page active" id="page-chat"><div class="messages" id="mainMessages"></div><div class="composer"><input id="mainText" maxlength="1000" placeholder="메시지를 입력해요"><button class="send" id="mainSend">전송</button></div></section>
<section class="page" id="page-rooms"><button class="primary" id="createRoom">＋ 채팅방 만들기</button><div class="sub" style="margin:10px 0">친구들과 이야기할 방을 만들어요.</div><div id="roomList"></div></section>
<section class="page" id="page-online"><div class="sub" style="margin-bottom:10px">최근 90초 안에 접속한 친구들이 보여요.</div><div id="onlineList"></div></section>
<section class="page" id="page-friends"><div id="friendList"></div></section>
<section class="page" id="page-items"><div class="card" style="text-align:center"><div style="font-size:42px">💝</div><b>좋은마음 아이템</b><div id="heartCount" style="font-size:28px;color:var(--deep)">0개</div><small class="muted">친구를 추가하면 1개를 받아요.</small></div></section><footer>뚱띠월드 🍑</footer></div>
<div class="overlay" id="roomOverlay"><div class="modal"><h3 id="roomTitle">채팅방</h3><div class="messages" id="roomMessages" style="height:55dvh"></div><div class="composer"><input id="roomText" maxlength="1000" placeholder="메시지 입력"><button class="send" id="roomSend">전송</button></div><button class="soft" id="closeRoom" style="width:100%">닫기</button></div></div>
<div class="overlay" id="whisperOverlay"><div class="modal"><h3 id="whisperTitle">귓속말</h3><div class="messages" id="whisperMessages" style="height:50dvh"></div><div class="composer"><input id="whisperText" maxlength="1000" placeholder="친구에게만 보이는 메시지"><button class="send" id="whisperSend">전송</button></div><button class="soft" id="closeWhisper" style="width:100%">닫기</button></div></div>
<div id="setup"><div class="setup-card"><div style="font-size:40px">🍓🍑🍊</div><h2>뚱띠월드에 오신 걸 환영해요!</h2><p class="muted">닉네임과 과일 프로필을 골라주세요.</p><input id="nickname" maxlength="20" placeholder="닉네임 (최대 20자)" style="width:100%"><p>과일 프로필 선택</p><div class="fruit" id="fruitPicker" style="justify-content:center"></div><button class="primary" id="saveProfile" style="width:100%;margin-top:16px">시작하기</button></div></div>
<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#49323b;color:white;padding:10px 15px;border-radius:20px;display:none;z-index:20;font-size:13px"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInAnonymously,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,orderBy,onSnapshot,serverTimestamp,where} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDI9ygzpduSVl8iayPFsJ0qTwrza9B6uY",authDomain:"anonymous-chat-9cc26.firebaseapp.com",projectId:"anonymous-chat-9cc26",storageBucket:"anonymous-chat-9cc26.firebasestorage.app",messagingSenderId:"20872212384",appId:"1:20872212384:web:1fcc2e28d084e6bde33ec5"};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const fruits=["🍓","🍑","🍊","🍋","🍉","🍇","🍒","🍍","🥝","🍎","🍐","🥭","🫐","🍈"];
let user=null,profile=null,selectedFruit="🍓",people=[],currentRoom=null,whisperTarget=null,unsubs=[];
function toast(t){$("toast").textContent=t;$("toast").style.display="block";setTimeout(()=>$("toast").style.display="none",2600)}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function avatar(p){return p?.avatar||"🍓"}
function drawMessages(id,docs){const el=$(id);el.innerHTML="";docs.forEach(m=>{const d=document.createElement("div");d.className="msg"+(m.uid===user.uid?" mine":"");d.innerHTML=`<div class="meta">${esc(m.avatar||"🍓")} ${esc(m.nickname||"친구")}</div><div>${esc(m.text||"")}</div>`;el.append(d)});el.scrollTop=el.scrollHeight}
function listen(path,id){return onSnapshot(query(collection(db,path),orderBy("createdAt","asc")),s=>drawMessages(id,s.docs.map(d=>d.data())),e=>toast("불러오기 실패: "+e.message))}
function listenAll(){unsubs.forEach(f=>f());unsubs=[];unsubs.push(listen("messages","mainMessages"));unsubs.push(onSnapshot(collection(db,"users"),s=>{people=s.docs.map(d=>({uid:d.id,...d.data()}));renderOnline();renderFriends()}));unsubs.push(onSnapshot(collection(db,"rooms"),s=>renderRooms(s.docs.map(d=>({id:d.id,...d.data()})))));unsubs.push(onSnapshot(collection(db,"users",user.uid,"friends"),s=>{renderFriends();}));unsubs.push(onSnapshot(doc(db,"users",user.uid),s=>{if(s.exists()){$("heartCount").textContent=(s.data().heartItems||0)+"개";profile={...profile,...s.data()}}}));}
async function send(path,text){text=text.trim();if(!text||!user||!profile)return;try{await addDoc(collection(db,path),{uid:user.uid,nickname:profile.nickname,avatar:profile.avatar,text,createdAt:serverTimestamp()})}catch(e){toast("전송 실패: "+e.message)}}
$("mainSend").onclick=()=>{send("messages",$("mainText").value);$("mainText").value=""};$("mainText").onkeydown=e=>{if(e.key==="Enter")$("mainSend").click()};
$("fruitPicker").innerHTML=fruits.map(f=>`<button type="button" data-fruit="${f}" class="${f===selectedFruit?"sel":""}">${f}</button>`).join("");$("fruitPicker").onclick=e=>{const b=e.target.closest("button");if(!b)return;selectedFruit=b.dataset.fruit;[...$("fruitPicker").children].forEach(x=>x.classList.toggle("sel",x===b))};
$("saveProfile").onclick=async()=>{const nickname=$("nickname").value.trim();if(!nickname)return toast("닉네임을 입력해 주세요.");profile={nickname,avatar:selectedFruit,heartItems:0};try{await setDoc(doc(db,"users",user.uid),{...profile,online:true,lastSeen:serverTimestamp()},{merge:true});$("setup").style.display="none";listenAll();presence()}catch(e){toast("프로필 저장 실패: "+e.message)}};
function presence(){const ping=()=>updateDoc(doc(db,"users",user.uid),{online:true,lastSeen:serverTimestamp()}).catch(()=>{});ping();setInterval(ping,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)ping()});window.addEventListener("pagehide",()=>updateDoc(doc(db,"users",user.uid),{online:false,lastSeen:serverTimestamp()}).catch(()=>{}))}
function renderOnline(){const el=$("onlineList");el.innerHTML="";const active=people.filter(p=>p.uid!==user.uid&&p.online&&p.lastSeen?.toDate&&Date.now()-p.lastSeen.toDate().getTime()<90000);if(!active.length){el.innerHTML='<div class="empty">현재 접속 중인 친구가 없어요.</div>';return}active.forEach(p=>el.append(userCard(p,true)))}
function userCard(p,online=false){const d=document.createElement("div");d.className="card row";d.innerHTML=`<div class="avatar">${esc(avatar(p))}</div><div class="grow"><b>${esc(p.nickname||"친구")}</b><div class="muted">${online?"🟢 접속 중":"💗 내 친구"}</div></div><button class="soft">${online?"친구 추가":"💌 귓속말"}</button>`;d.querySelector("button").onclick=()=>online?addFriend(p):openWhisper(p);return d}
async function addFriend(p){if(p.uid===user.uid)return;try{const ref=doc(db,"users",user.uid,"friends",p.uid),old=await getDoc(ref);if(old.exists())return toast("이미 친구예요.");await setDoc(ref,{uid:p.uid,nickname:p.nickname,avatar:avatar(p),createdAt:serverTimestamp()});await setDoc(doc(db,"users",p.uid,"friends",user.uid),{uid:user.uid,nickname:profile.nickname,avatar:profile.avatar,createdAt:serverTimestamp()});await updateDoc(doc(db,"users",user.uid),{heartItems:(profile.heartItems||0)+1});profile.heartItems=(profile.heartItems||0)+1;toast("친구 추가 완료! 💗")}catch(e){toast("친구 추가 실패: "+e.message)}}
async function renderFriends(){if(!user)return;const el=$("friendList");try{const {getDocs}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");const s=await getDocs(collection(db,"users",user.uid,"friends"));el.innerHTML="";if(s.empty){el.innerHTML='<div class="empty">아직 친구가 없어요. 접속자에서 친구를 추가해 보세요!</div>';return}s.forEach(x=>{const f=x.data(),p=people.find(v=>v.uid===x.id)||f;el.append(userCard({...p,uid:x.id},false))})}catch(e){toast("친구 목록 오류: "+e.message)}}
function renderRooms(rooms){const el=$("roomList");el.innerHTML="";if(!rooms.length){el.innerHTML='<div class="empty">아직 채팅방이 없어요.</div>';return}rooms.forEach(r=>{const d=document.createElement("div");d.className="card row";d.innerHTML=`<div class="grow"><b>🏠 ${esc(r.title)}</b><div class="muted">${esc(r.ownerName||"친구")}</div></div><button class="soft">입장하기</button>`;d.querySelector("button").onclick=()=>openRoom(r);el.append(d)})}
$("createRoom").onclick=async()=>{const title=prompt("채팅방 이름을 입력해 주세요.");if(!title?.trim())return;try{await addDoc(collection(db,"rooms"),{title:title.trim().slice(0,30),owner:user.uid,ownerName:profile.nickname,createdAt:serverTimestamp()});toast("채팅방을 만들었어요!")}catch(e){toast("방 만들기 실패: "+e.message)}};
function openRoom(r){currentRoom=r;$("roomTitle").textContent="🏠 "+r.title;$("roomOverlay").classList.add("show");if(window.roomStop)window.roomStop();window.roomStop=listen("roomMessages_"+r.id,"roomMessages")}
$("closeRoom").onclick=()=>{$("roomOverlay").classList.remove("show");if(window.roomStop)window.roomStop();currentRoom=null};$("roomSend").onclick=()=>{if(currentRoom){send("roomMessages_"+currentRoom.id,$("roomText").value);$("roomText").value=""}};$("roomText").onkeydown=e=>{if(e.key==="Enter")$("roomSend").click()};
function openWhisper(p){whisperTarget=p;$("whisperTitle").textContent="💌 "+p.nickname+"님과 귓속말";$("whisperOverlay").classList.add("show");if(window.whisperStop)window.whisperStop();const path="whispers_"+[user.uid,p.uid].sort().join("_");window.whisperStop=listen(path,"whisperMessages")}
$("closeWhisper").onclick=()=>{$("whisperOverlay").classList.remove("show");if(window.whisperStop)window.whisperStop();whisperTarget=null};$("whisperSend").onclick=async()=>{if(!whisperTarget)return;const t=$("whisperText").value.trim();if(!t)return;const path="whispers_"+[user.uid,whisperTarget.uid].sort().join("_");try{await addDoc(collection(db,path),{uid:user.uid,nickname:profile.nickname,avatar:profile.avatar,text:t,toUid:whisperTarget.uid,createdAt:serverTimestamp()});$("whisperText").value=""}catch(e){toast("귓속말 전송 실패: "+e.message)}};$("whisperText").onkeydown=e=>{if(e.key==="Enter")$("whisperSend").click()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id==="page-"+b.dataset.page))});
onAuthStateChanged(auth,async u=>{if(!u)return;user=u;try{const s=await getDoc(doc(db,"users",u.uid));if(s.exists()&&s.data().nickname){profile=s.data();$("setup").style.display="none";$("heartCount").textContent=(profile.heartItems||0)+"개";listenAll();presence()}else{$("setup").style.display="flex"}}catch(e){toast("사용자 정보 오류: "+e.message)}});
signInAnonymously(auth).catch(e=>toast("익명 로그인 실패: "+e.message));
</script></body></html>
